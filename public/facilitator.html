<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Facilitator — Hive Mind</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a18;
      color: #fff;
      font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
      padding: 28px 24px 60px;
      max-width: 520px;
      margin: 0 auto;
    }
    h1 { font-size: 0.8rem; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.35); margin-bottom: 28px; }
    h2 { font-size: 0.68rem; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(255,255,255,0.25); margin-bottom: 12px; }

    .section { margin-bottom: 32px; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 20px; }
    .section:first-of-type { border-top: none; padding-top: 0; }

    /* Chips */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      color: rgba(255,255,255,0.55);
      cursor: pointer;
      font-family: inherit;
      font-size: 0.78rem;
      padding: 6px 14px;
      transition: all 0.15s;
    }
    .chip:hover { background: rgba(255,255,255,0.14); color: #fff; border-color: rgba(255,255,255,0.25); }
    .chip.narrative { border-color: rgba(100,200,255,0.25); color: rgba(100,200,255,0.7); }
    .chip.narrative:hover { background: rgba(100,200,255,0.1); color: rgba(140,220,255,1); }

    /* Seed input */
    .seed-row {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }
    .seed-row input {
      flex: 1;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      color: #fff;
      font-family: inherit;
      font-size: 0.9rem;
      padding: 10px 14px;
      outline: none;
    }
    .seed-row input::placeholder { color: rgba(255,255,255,0.2); }
    .seed-row input:focus { border-color: rgba(255,255,255,0.35); }

    /* Buttons */
    button {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.82rem;
      padding: 10px 16px;
      transition: background 0.15s;
      white-space: nowrap;
    }
    button:hover { background: rgba(255,255,255,0.16); }
    button.primary { background: rgba(255,255,255,0.88); color: #050510; font-weight: 600; border-color: transparent; }
    button.primary:hover { background: rgba(255,255,255,1); }
    button.danger { border-color: rgba(255,80,80,0.35); color: rgba(255,120,100,0.8); }
    button.danger:hover { background: rgba(255,80,80,0.15); }
    button.freeze-active { background: rgba(100,180,255,0.15); border-color: rgba(100,180,255,0.4); color: rgba(140,210,255,0.9); }

    /* Slider rows */
    .slider-row {
      display: grid;
      grid-template-columns: 100px 1fr 40px;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .slider-row label { font-size: 0.8rem; color: rgba(255,255,255,0.5); }
    input[type=range] { width: 100%; accent-color: rgba(255,255,255,0.6); }
    .val { font-size: 0.75rem; color: rgba(255,255,255,0.35); text-align: right; }

    /* Status */
    .status { font-size: 0.75rem; color: rgba(150,255,180,0.6); margin-top: 8px; min-height: 18px; }

    /* Big actions row */
    .big-actions { display: flex; gap: 10px; flex-wrap: wrap; }

    /* Queue info */
    #queue-info { font-size: 0.72rem; color: rgba(255,255,255,0.2); letter-spacing: 0.05em; margin-top: 6px; }
  </style>
</head>
<body>

<h1>Hive Mind · Facilitator</h1>

<!-- Big action buttons -->
<div class="section">
  <h2>Session control</h2>
  <div class="big-actions">
    <button id="freeze-btn">Freeze display</button>
    <button id="reset-btn" class="danger">Reset everything</button>
  </div>
  <div class="status" id="freeze-status"></div>
</div>

<!-- Seed a word (bypasses queue) -->
<div class="section">
  <h2>Inject a word — goes to front of queue</h2>
  <div class="chips">
    <button class="chip narrative" data-seed="together">together</button>
    <button class="chip narrative" data-seed="us">us</button>
    <button class="chip narrative" data-seed="collective">collective</button>
    <button class="chip narrative" data-seed="emergence">emergence</button>
    <button class="chip narrative" data-seed="alive">alive</button>
    <button class="chip narrative" data-seed="one">one</button>
    <button class="chip narrative" data-seed="hive mind">hive mind</button>
  </div>
  <div class="seed-row">
    <input type="text" id="seed-input" placeholder="type any word…" maxlength="80">
    <button class="primary" id="seed-btn">Inject</button>
  </div>
  <div class="status" id="seed-status"></div>
  <div id="queue-info"></div>
</div>

<!-- Emotion presets -->
<div class="section">
  <h2>Emotion presets — override state directly</h2>
  <div class="chips">
    <button class="chip" data-preset="neutral">Neutral</button>
    <button class="chip" data-preset="calm">Calm</button>
    <button class="chip" data-preset="anxious">Anxious</button>
    <button class="chip" data-preset="powerful">Powerful</button>
    <button class="chip" data-preset="playful">Playful</button>
    <button class="chip" data-preset="melancholy">Melancholy</button>
    <button class="chip" data-preset="chaotic">Chaotic</button>
    <button class="chip" data-preset="focused">Focused</button>
  </div>
</div>

<!-- Manual sliders -->
<div class="section">
  <h2>Manual override</h2>
  <div class="slider-row"><label>Hue</label><input type="range" id="hue" min="0" max="360" step="1" value="200"><span class="val" id="hue-val">200</span></div>
  <div class="slider-row"><label>Saturation</label><input type="range" id="saturation" min="0" max="1" step="0.01" value="0.6"><span class="val" id="saturation-val">0.60</span></div>
  <div class="slider-row"><label>Brightness</label><input type="range" id="brightness" min="0" max="1" step="0.01" value="0.7"><span class="val" id="brightness-val">0.70</span></div>
  <div class="slider-row"><label>Speed</label><input type="range" id="speed" min="0" max="1" step="0.01" value="0.3"><span class="val" id="speed-val">0.30</span></div>
  <div class="slider-row"><label>Complexity</label><input type="range" id="complexity" min="0" max="1" step="0.01" value="0.4"><span class="val" id="complexity-val">0.40</span></div>
  <div class="slider-row"><label>Size</label><input type="range" id="size" min="0.3" max="1.5" step="0.01" value="1.0"><span class="val" id="size-val">1.00</span></div>
  <div class="slider-row"><label>Chaos</label><input type="range" id="chaos" min="0" max="1" step="0.01" value="0.2"><span class="val" id="chaos-val">0.20</span></div>
  <br>
  <button id="apply-btn" class="primary">Apply to blob</button>
  <div class="status" id="override-status"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  let isFrozen = false;

  // ── Secret ────────────────────────────────────────────────────────────────
  let _secret = localStorage.getItem('facilitator_secret') || '';
  if (!_secret) {
    _secret = prompt('Enter facilitator password:') || '';
    if (_secret) localStorage.setItem('facilitator_secret', _secret);
  }

  // ── Helpers ──────────────────────────────────────────────────────────────
  async function post(url, body) {
    const r = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...body, secret: _secret }),
    });
    return r.json();
  }

  function flash(el, msg, color = 'rgba(150,255,180,0.7)') {
    el.style.color = color;
    el.textContent = msg;
    setTimeout(() => { el.textContent = ''; }, 2200);
  }

  // ── Sliders ───────────────────────────────────────────────────────────────
  const params = ['hue','saturation','brightness','speed','complexity','size','chaos'];
  params.forEach(p => {
    const el = document.getElementById(p);
    const val = document.getElementById(`${p}-val`);
    el.addEventListener('input', () => { val.textContent = parseFloat(el.value).toFixed(p==='hue'?0:2); });
  });

  function getSliders() {
    const obj = {};
    params.forEach(p => { obj[p] = parseFloat(document.getElementById(p).value); });
    return obj;
  }
  function setSliders(obj) {
    params.forEach(p => {
      if (obj[p] !== undefined) {
        document.getElementById(p).value = obj[p];
        document.getElementById(`${p}-val`).textContent = parseFloat(obj[p]).toFixed(p==='hue'?0:2);
      }
    });
  }

  // ── Presets ───────────────────────────────────────────────────────────────
  const PRESETS = {
    neutral:   { hue:200, saturation:0.5,  brightness:0.6,  speed:0.3,  complexity:0.4,  size:1.0, chaos:0.2  },
    calm:      { hue:200, saturation:0.6,  brightness:0.75, speed:0.12, complexity:0.2,  size:1.0, chaos:0.05 },
    anxious:   { hue:22,  saturation:0.9,  brightness:0.65, speed:0.92, complexity:0.95, size:1.1, chaos:0.88 },
    powerful:  { hue:270, saturation:0.8,  brightness:0.45, speed:0.45, complexity:0.5,  size:1.4, chaos:0.12 },
    playful:   { hue:45,  saturation:0.9,  brightness:0.85, speed:0.72, complexity:0.6,  size:0.9, chaos:0.5  },
    melancholy:{ hue:220, saturation:0.3,  brightness:0.28, speed:0.08, complexity:0.3,  size:0.8, chaos:0.04 },
    chaotic:   { hue:320, saturation:0.85, brightness:0.7,  speed:1.0,  complexity:1.0,  size:1.2, chaos:1.0  },
    focused:   { hue:180, saturation:0.7,  brightness:0.6,  speed:0.2,  complexity:0.3,  size:1.05,chaos:0.08 },
  };

  document.querySelectorAll('[data-preset]').forEach(el => {
    el.addEventListener('click', async () => {
      const p = PRESETS[el.dataset.preset];
      if (!p) return;
      setSliders(p);
      await post('/override', { params: p });
      flash(document.getElementById('override-status'), `${el.dataset.preset} applied ✓`);
    });
  });

  document.getElementById('apply-btn').addEventListener('click', async () => {
    await post('/override', { params: getSliders() });
    flash(document.getElementById('override-status'), 'Applied ✓');
  });

  // ── Seed ──────────────────────────────────────────────────────────────────
  async function seed(text) {
    if (!text.trim()) return;
    const data = await post('/seed', { text: text.trim() });
    if (data.ok) flash(document.getElementById('seed-status'), `"${text}" injected ✓`);
    else flash(document.getElementById('seed-status'), data.error || 'Error', 'rgba(255,120,100,0.8)');
    document.getElementById('seed-input').value = '';
  }

  document.querySelectorAll('[data-seed]').forEach(el => {
    el.addEventListener('click', () => seed(el.dataset.seed));
  });
  document.getElementById('seed-btn').addEventListener('click', () => {
    seed(document.getElementById('seed-input').value);
  });
  document.getElementById('seed-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') seed(e.target.value);
  });

  // ── Freeze ────────────────────────────────────────────────────────────────
  const freezeBtn = document.getElementById('freeze-btn');
  freezeBtn.addEventListener('click', async () => {
    const data = await post('/freeze', {});
    isFrozen = data.frozen;
    freezeBtn.textContent = isFrozen ? 'Unfreeze display' : 'Freeze display';
    freezeBtn.classList.toggle('freeze-active', isFrozen);
    flash(document.getElementById('freeze-status'), isFrozen ? 'Display frozen ❄' : 'Display unfrozen');
  });

  // ── Reset ─────────────────────────────────────────────────────────────────
  document.getElementById('reset-btn').addEventListener('click', async () => {
    if (!confirm('Reset everything? This clears the blob, all cells, and the queue.')) return;
    await post('/reset', {});
    isFrozen = false;
    freezeBtn.textContent = 'Freeze display';
    freezeBtn.classList.remove('freeze-active');
    flash(document.getElementById('freeze-status'), 'Reset complete');
  });

  // ── Live state sync ───────────────────────────────────────────────────────
  socket.on('state', setSliders);

  socket.on('queue_update', ({ queueLength }) => {
    document.getElementById('queue-info').textContent =
      queueLength > 0 ? `${queueLength} prompt${queueLength!==1?'s':''} in queue` : '';
  });
</script>
</body>
</html>
