<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hive Mind Blob</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #050510; overflow: hidden; width: 100vw; height: 100vh; cursor: none; }
    canvas { display: block; }

    #label {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Inter', 'Helvetica Neue', sans-serif;
      font-size: 1.1rem;
      font-weight: 300;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      opacity: 0;
      transition: opacity 0.5s ease;
      pointer-events: none;
    }
    #label.visible { opacity: 1; }

    #count {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Inter', 'Helvetica Neue', sans-serif;
      font-size: 0.75rem;
      font-weight: 300;
      letter-spacing: 0.15em;
      color: rgba(255,255,255,0.18);
      pointer-events: none;
    }

    #sound-hint {
      position: fixed;
      top: 24px;
      right: 28px;
      font-family: 'Inter', 'Helvetica Neue', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    #mute-btn {
      position: fixed;
      top: 20px;
      right: 24px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      color: rgba(255,255,255,0.35);
      cursor: pointer;
      font-family: 'Inter', 'Helvetica Neue', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 6px 12px;
      display: none;
      transition: background 0.2s, color 0.2s;
    }
    #mute-btn:hover { background: rgba(255,255,255,0.14); color: rgba(255,255,255,0.7); }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="label"></div>
  <div id="count">0 contributions</div>
  <div id="sound-hint">click for sound</div>
  <button id="mute-btn">♪ on</button>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const canvas = document.getElementById('c');
    const ctx    = canvas.getContext('2d');
    const labelEl    = document.getElementById('label');
    const countEl    = document.getElementById('count');
    const soundHint  = document.getElementById('sound-hint');
    const muteBtn    = document.getElementById('mute-btn');
    let muted = false;

    let W, H;
    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // ── Blob state ────────────────────────────────────────────────────────────
    const KEYS = ['hue','saturation','brightness','speed','complexity','size','chaos'];

    let current = { hue:200, saturation:0.5, brightness:0.6, speed:0.25, complexity:0.35, size:1.0, chaos:0.15 };
    let target  = { ...current };
    let vel     = { hue:0, saturation:0, brightness:0, speed:0, complexity:0, size:0, chaos:0 };

    const SPRING_K = 0.055;
    const DAMPING  = 0.68;

    function hueDiff(a, b) {
      let d = b - a;
      if (d >  180) d -= 360;
      if (d < -180) d += 360;
      return d;
    }

    function springStep() {
      for (const k of KEYS) {
        const diff = k === 'hue' ? hueDiff(current[k], target[k]) : (target[k] - current[k]);
        vel[k] = vel[k] * DAMPING + diff * SPRING_K;
        current[k] += vel[k];
      }
      current.hue = ((current.hue % 360) + 360) % 360;
    }

    // ── Blob position (bouncing around the screen) ────────────────────────────
    let bx = W / 2, by = H / 2;
    let bvx = 0.8, bvy = 0.55;

    // Squash & stretch state
    let sqX = 1, sqY = 1, sqVX = 0, sqVY = 0;
    const SQ_K = 0.14, SQ_DAMP = 0.6;

    // Breathing state — slow irregular pulse
    let breathPhase = 0, breathScale = 1;

    function updateBreath(s) {
      // Irregular rhythm: two sine waves at slightly different speeds
      breathPhase += 0.012 + s.speed * 0.008;
      const slow = Math.sin(breathPhase * 0.7);
      const fast = Math.sin(breathPhase * 1.3 + 1.2) * 0.3;
      breathScale = 1 + (slow + fast) * (0.04 + s.complexity * 0.025);
    }

    function triggerSquash(axis) {
      if (axis === 'x') { sqX = 0.32; sqY = 1.75; }
      else              { sqX = 1.75; sqY = 0.32; }
      sqVX = 0; sqVY = 0;
    }

    function updateSquash(s) {
      // Spring squash back to 1
      sqVX = sqVX * SQ_DAMP + (1 - sqX) * SQ_K;
      sqVY = sqVY * SQ_DAMP + (1 - sqY) * SQ_K;
      sqX += sqVX;
      sqY += sqVY;

    }

    function updatePosition(s) {
      const spd = 0.4 + s.speed * 2.8;

      const mag = Math.sqrt(bvx * bvx + bvy * bvy) || 1;
      bvx = (bvx / mag) * spd;
      bvy = (bvy / mag) * spd;

      bx += bvx;
      by += bvy;

      const margin = Math.min(W, H) * 0.18 * s.size;

      if (bx < margin)     { bx = margin;     bvx =  Math.abs(bvx); triggerSquash('x'); }
      if (bx > W - margin) { bx = W - margin; bvx = -Math.abs(bvx); triggerSquash('x'); }
      if (by < margin)     { by = margin;      bvy =  Math.abs(bvy); triggerSquash('y'); }
      if (by > H - margin) { by = H - margin;  bvy = -Math.abs(bvy); triggerSquash('y'); }
    }

    // ── Sound ─────────────────────────────────────────────────────────────────
    let _ac = null, _osc1 = null, _osc2 = null, _gainNode = null, _filter = null, _lfo = null, _lfoGain = null;

    function initAudio() {
      if (_ac) return;
      try {
        _ac = new (window.AudioContext || window.webkitAudioContext)();

        _gainNode = _ac.createGain();
        _gainNode.gain.value = 0.0;

        _filter = _ac.createBiquadFilter();
        _filter.type = 'lowpass';
        _filter.frequency.value = 500;
        _filter.Q.value = 2.5;

        _osc1 = _ac.createOscillator();
        _osc1.type = 'sine';
        _osc1.frequency.value = 80;

        _osc2 = _ac.createOscillator();
        _osc2.type = 'sine';
        _osc2.frequency.value = 120;

        // Slow LFO for tremolo
        _lfo = _ac.createOscillator();
        _lfo.type = 'sine';
        _lfo.frequency.value = 3;
        _lfoGain = _ac.createGain();
        _lfoGain.gain.value = 0.02;
        _lfo.connect(_lfoGain);
        _lfoGain.connect(_gainNode.gain);

        _osc1.connect(_filter);
        _osc2.connect(_filter);
        _filter.connect(_gainNode);
        _gainNode.connect(_ac.destination);

        _osc1.start();
        _osc2.start();
        _lfo.start();

        // Fade in
        _gainNode.gain.setTargetAtTime(0.1, _ac.currentTime, 1.5);

        soundHint.style.opacity = '0';
        muteBtn.style.display = 'block';
      } catch(e) {
        console.warn('Audio init failed:', e);
      }
    }

    function updateSound(s) {
      if (!_ac || !_osc1) return;
      const now = _ac.currentTime;

      // Pitch from hue: 50–180 Hz drone
      const freq = 50 + (s.hue / 360) * 130;
      _osc1.frequency.setTargetAtTime(freq,        now, 1.2);
      _osc2.frequency.setTargetAtTime(freq * 1.502, now, 1.2); // perfect fifth

      // Volume from brightness (skip if muted)
      if (!muted) {
        const vol = 0.05 + s.brightness * 0.13;
        _gainNode.gain.setTargetAtTime(vol, now, 0.6);
      }

      // Filter opens with complexity + chaos
      _filter.frequency.setTargetAtTime(150 + s.complexity * 1600 + s.chaos * 900, now, 0.4);
      _filter.Q.setTargetAtTime(1.5 + s.chaos * 7, now, 0.4);

      // LFO tremolo speed from speed param
      _lfo.frequency.setTargetAtTime(0.5 + s.speed * 8, now, 0.6);
      _lfoGain.gain.setTargetAtTime(0.015 + s.chaos * 0.04, now, 0.5);
    }

    function toggleMute() {
      if (!_ac) return;
      muted = !muted;
      if (muted) {
        _ac.suspend();
        muteBtn.textContent = '♪ off';
        muteBtn.style.color = 'rgba(255,100,80,0.5)';
      } else {
        _ac.resume();
        muteBtn.textContent = '♪ on';
        muteBtn.style.color = 'rgba(255,255,255,0.35)';
      }
    }

    muteBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleMute(); });

    // M key also toggles mute
    document.addEventListener('keydown', (e) => {
      if (e.key === 'm' || e.key === 'M') toggleMute();
    });

    document.addEventListener('click',      initAudio, { once: true });
    document.addEventListener('touchstart', initAudio, { once: true });

    // ── Noise ─────────────────────────────────────────────────────────────────
    function noise(x, y, t, freq, oct = 4) {
      let v = 0, a = 1, tot = 0;
      for (let i = 0; i < oct; i++) {
        v += Math.sin(x * freq + t * 1.1 + i * 2.3)
           * Math.cos(y * freq * 0.9 + t * 0.8 + i * 1.7) * a;
        tot += a; freq *= 1.85; a *= 0.52;
      }
      return v / tot;
    }

    function buildPoints(s, t, r, ox, oy) {
      const pts = [], n = 180;

      // Direction stretch: elongate along travel vector
      const spd   = Math.sqrt(bvx*bvx + bvy*bvy);
      const maxSpd = 0.4 + s.speed * 2.8;
      const stretch = Math.min(spd / (maxSpd || 1), 1) * 0.55;
      const tAngle  = Math.atan2(bvy, bvx);
      const cosT = Math.cos(tAngle), sinT = Math.sin(tAngle);

      for (let i = 0; i <= n; i++) {
        const a  = (i / n) * Math.PI * 2;
        const nx = Math.cos(a), ny = Math.sin(a);
        const n1 = noise(nx, ny,     t,          1.2 + s.complexity * 2.5);
        const n2 = noise(nx*2, ny*2, t * 1.3+5,  0.8 + s.chaos * 3.5);
        const d  = (n1 * 0.6 + n2 * 0.4) * r * (0.1 + s.complexity * 0.65 + s.chaos * 0.55);

        // Base point
        let px = Math.cos(a) * (r + d);
        let py = Math.sin(a) * (r + d);

        // 1. Squash & stretch + breathing
        px *= sqX * breathScale;
        py *= sqY * breathScale;

        // 2. Direction stretch (rotate → scale → rotate back)
        const lx =  px * cosT + py * sinT;  // local along travel
        const ly = -px * sinT + py * cosT;  // local perpendicular
        const sx = lx * (1 + stretch * 0.55);
        const sy = ly * (1 - stretch * 0.28);
        px = sx * cosT - sy * sinT;
        py = sx * sinT + sy * cosT;

        pts.push({ x: ox + px, y: oy + py });
      }
      return pts;
    }

    function buildNucleus(s, t, r, ox, oy) {
      const pts = [], n = 80;
      for (let i = 0; i <= n; i++) {
        const a = (i / n) * Math.PI * 2;
        const nx = Math.cos(a), ny = Math.sin(a);
        const d = noise(nx, ny, t * 0.6 + 10, 1.5 + s.complexity) * r * 0.35;
        pts.push({ x: ox + Math.cos(a) * (r + d), y: oy + Math.sin(a) * (r + d) });
      }
      return pts;
    }

    function tracePath(pts, dx, dy) {
      ctx.beginPath();
      ctx.moveTo(pts[0].x + dx, pts[0].y + dy);
      for (let i = 1; i < pts.length; i++) {
        const p0 = pts[i-1], p1 = pts[i];
        ctx.quadraticCurveTo(
          p0.x + dx, p0.y + dy,
          (p0.x + p1.x)/2 + dx, (p0.y + p1.y)/2 + dy
        );
      }
      ctx.closePath();
    }

    function drawFill(pts, ox, oy, dx, dy, hShift, alpha, blur, r) {
      const h   = ((current.hue + hShift) % 360 + 360) % 360;
      const sat = Math.round(current.saturation * 100);
      const bri = Math.round(30 + current.brightness * 55);
      ctx.save();
      ctx.filter = `blur(${blur}px)`;
      tracePath(pts, dx, dy);
      const g = ctx.createRadialGradient(ox+dx, oy+dy, 0, ox+dx, oy+dy, r * 1.2);
      g.addColorStop(0,    `hsla(${h},${sat}%,${Math.min(bri+28,96)}%,${alpha})`);
      g.addColorStop(0.55, `hsla(${(h+20)%360},${sat}%,${bri}%,${alpha*0.88})`);
      g.addColorStop(1,    `hsla(${(h+45)%360},${Math.max(sat-15,0)}%,${Math.max(bri-12,8)}%,${alpha*0.5})`);
      ctx.fillStyle = g;
      ctx.fill();
      ctx.restore();
    }

    // ── Label ─────────────────────────────────────────────────────────────────
    let labelTimeout;
    function showLabel(text, count) {
      labelEl.textContent = text;
      labelEl.classList.add('visible');
      countEl.textContent = `${count} contribution${count !== 1 ? 's' : ''}`;
      clearTimeout(labelTimeout);
      labelTimeout = setTimeout(() => labelEl.classList.remove('visible'), 3200);
    }

    // ── Draw loop ─────────────────────────────────────────────────────────────
    let t = 0;

    function draw() {
      const s = current;
      t += 0.003 + s.speed * 0.045;

      springStep();
      updatePosition(s);
      updateSquash(s);
      updateBreath(s);
      updateSound(s);

      // Dark trail
      ctx.fillStyle = 'rgba(5,5,16,0.15)';
      ctx.fillRect(0, 0, W, H);

      const r = Math.min(W, H) * 0.25 * s.size;
      const pts = buildPoints(s, t, r, bx, by);
      const ab  = 3 + s.chaos * 30; // aberration amount

      // Glow
      const glows = [
        { blur: 110 + s.chaos * 80, alpha: 0.06 },
        { blur: 55  + s.speed * 22, alpha: 0.10 },
        { blur: 24,                  alpha: 0.17 },
      ];
      for (const g of glows) {
        ctx.save();
        ctx.filter = `blur(${g.blur}px)`;
        tracePath(pts, 0, 0);
        const h   = Math.round(s.hue);
        const sat = Math.round(s.saturation * 100);
        const bri = Math.round(30 + s.brightness * 55);
        ctx.fillStyle = `hsla(${h},${sat}%,${bri}%,${g.alpha})`;
        ctx.fill();
        ctx.restore();
      }

      // Chromatic aberration — screen blend
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      drawFill(pts, bx, by, -ab,        0,           -25, 0.72, 1.5, r);
      drawFill(pts, bx, by,   0, ab * 0.3,            10, 0.72, 1.5, r);
      drawFill(pts, bx, by,  ab,        0,             35, 0.72, 1.5, r);
      ctx.restore();

      // Crisp core
      ctx.save();
      ctx.globalCompositeOperation = 'source-over';
      drawFill(pts, bx, by, 0, 0, 0, 0.5, 0.8, r);
      ctx.restore();

      // Nucleus — small inner blob, offset, drifts slowly
      const nAngle = t * 0.18;
      const nDrift = r * 0.22;
      const nx = bx + Math.cos(nAngle) * nDrift;
      const ny = by + Math.sin(nAngle * 0.7) * nDrift;
      const nr = r * (0.28 + s.complexity * 0.08) * breathScale;
      const nucleusPts = buildNucleus(s, t, nr, nx, ny);
      ctx.save();
      ctx.globalCompositeOperation = 'source-over';
      ctx.filter = 'blur(6px)';
      tracePath(nucleusPts, 0, 0);
      const nh = ((s.hue + 45) % 360);
      const ng = ctx.createRadialGradient(nx, ny, 0, nx, ny, nr);
      ng.addColorStop(0,   `hsla(${nh},${Math.round(s.saturation*100)}%,88%,0.55)`);
      ng.addColorStop(0.6, `hsla(${nh},${Math.round(s.saturation*80)}%,65%,0.3)`);
      ng.addColorStop(1,   `hsla(${nh},${Math.round(s.saturation*60)}%,40%,0.0)`);
      ctx.fillStyle = ng;
      ctx.fill();
      ctx.restore();

      requestAnimationFrame(draw);
    }

    // ── Socket ────────────────────────────────────────────────────────────────
    const socket = io();
    socket.on('state', (state) => {
      // Velocity kick for overshoot
      for (const k of KEYS) {
        if (k === 'hue') vel[k] += hueDiff(current[k], state[k]) * 0.45;
        else             vel[k] += (state[k] - current[k]) * 0.45;
      }
      target = { hue:state.hue, saturation:state.saturation, brightness:state.brightness,
                 speed:state.speed, complexity:state.complexity, size:state.size, chaos:state.chaos };
      if (state.label) showLabel(state.label, state.promptCount || 0);
    });

    draw();
  </script>
</body>
</html>
